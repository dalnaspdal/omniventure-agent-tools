[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniventure-tools"
version = "1.0.1"
description = "Sub-15ms edge intelligence tools for Claude Desktop, Cursor, LangChain, and autonomous AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "OmniVenture Fleet", email = "dalnaspidal@gmail.com" }
]
keywords = [
  "mcp", "model-context-protocol", "claude", "cursor",
  "langchain", "token-compression", "json-repair", "pii-redaction"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "httpx>=0.25.0",
  "pydantic>=2.0"
]

[project.urls]
Homepage = "https://omniventure-api.web.app"
Documentation = "https://omniventure-api.web.app"
Repository = "https://github.com/dalnaspdal/omniventure-agent-tools"

[project.scripts]
omniventure-mcp = "mcp.client_agent_mcp:run_stdio_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp*", "python_sdk*"]
