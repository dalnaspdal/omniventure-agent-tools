# Smithery MCP Server Configuration
# OmniVenture OS 2.0 — Master 5x5 Fleet Engine
startCommand:
  type: stdio

configSchema:
  type: object
  properties:
    fleet:
      type: string
      description: "Fleet to launch: syntax, distill, verify, finance, infra, or all"
      enum: ["syntax", "distill", "verify", "finance", "infra", "all"]
      default: "all"
    gatewayUrl:
      type: string
      description: "OmniVenture Gateway URL (default: http://localhost:8950)"
      default: "http://localhost:8950"

commandFunction: |-
  (config) => ({
    command: 'python3',
    args: ['-m', 'distribution.mcp.fleet_runner', '--fleet', config.fleet || 'all'],
    env: {
      OMNIVENTURE_GATEWAY_URL: config.gatewayUrl || 'http://localhost:8950'
    }
  })

exampleConfig:
  fleet: "all"
  gatewayUrl: "http://localhost:8950"
